
services:
  mysql:
    image: mysql:8.0
    container_name: event_mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/booking
    container_name: event_backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ULTRAMSG_INSTANCE_ID: ${ULTRAMSG_INSTANCE_ID}
      ULTRAMSG_TOKEN: ${ULTRAMSG_TOKEN}
      ADMIN_WHATSAPP_NUMBER: ${ADMIN_WHATSAPP_NUMBER}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend/decor-frontend
    container_name: event_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysqldata:
